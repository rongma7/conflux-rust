[package]
name = "malloc_size_of"
version = "0.0.1"
edition = "2021"
license = "MIT/Apache-2.0"

[dependencies]
cfx-types = { workspace = true }
cfg-if = { workspace = true }
hashbrown = { workspace = true }
winapi = { workspace = true }
slab = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }

# storage2: tikv-jemallocator is now gated behind the jemalloc-global feature
# so the crate compiles without pulling the allocator in when jemalloc isn't
# the globally selected one.
[target.'cfg(not(target_env = "msvc"))'.dependencies.tikv-jemallocator]
version = "0.6"
optional = true

[features]
jemalloc-global = ["tikv-jemallocator"]
